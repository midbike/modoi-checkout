<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modoi Checkout</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>T1 寵物時尚微電車</h1>

    <img
      src="https://placehold.co/600x400"
      alt="T1"
      class="product-image"
    >

    <h2>NT$49,800</h2>

    <p>
      適合中大型犬外出使用，
      讓毛孩與主人一起探索更多風景。
    </p>

    <form>

      <input
        type="text"
        placeholder="姓名"
      >

      <input
        type="tel"
        placeholder="手機"
      >

      <input
        type="email"
        placeholder="Email"
      >

      <button type="submit">
        前往付款
      </button>

    </form>

  </div>

</body>
</html>
